<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<body>
<header th:fragment="header" class="topbar">
    <div class="brand">
        <a th:href="@{/}">UTE SHOP</a>
    </div>

    <div class="account" sec:authorize="isAuthenticated()">
        <img th:src="${#authentication.principal.images != null and !#strings.isEmpty(#authentication.principal.images)
                       ? #authentication.principal.images
                       : 'https://i.pravatar.cc/40'}"
             alt="Avatar"
             width="36" height="36"
             style="border-radius:50%; object-fit:cover; vertical-align:middle; margin-right:8px;">

        <span th:text="${#authentication.principal.fullName}">Nguyễn Văn A</span>
        <span style="opacity:0.8; font-size:13px;"
              th:text="'(' + ${#authentication.principal.username} + ')'">(user)</span>
        <span class="badge" th:text="${#authentication.principal.role}">USER</span>

        <form th:action="@{/logout}" method="post" style="display:inline; margin-left:12px;">
            <button class="link-button" type="submit">Đăng xuất</button>
        </form>
    </div>

    <div class="account" sec:authorize="!isAuthenticated()">
        <a th:href="@{/login}" style="color:#fff; text-decoration:none;">Đăng nhập</a>
    </div>
</header>
</body>
</html>

<!DOCTYPE html>
<html lang="vi"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layouts/layout}">
<head>
    <title>Trang chủ</title>
</head>
<body>
<main layout:fragment="content">
    <div class="panel">
        <h1>Trang chủ IOTSTAR SHOP</h1>
        <p>
            Xin chào
            <strong th:text="${#authentication.principal.fullName}">User</strong>!
        </p>
        <p>
            Bạn đang đăng nhập với tài khoản:
            <strong th:text="${#authentication.principal.username}">username</strong>
            (<span th:text="${#authentication.principal.email}">email</span>)
        </p>
        <p>
            Vai trò:
            <span class="badge" th:text="${#authentication.principal.role}">ROLE</span>
        </p>
    </div>
</main>
</body>
</html>

<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Đăng nhập - IOTSTAR SHOP</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body class="auth-page">

<div class="auth-card">
    <h1>IOTSTAR SHOP</h1>
    <h2>Đăng nhập</h2>

    <div class="alert error" th:if="${param.error}">
        Username/email hoặc mật khẩu không đúng.
    </div>
    <div class="alert success" th:if="${param.logout}">
        Bạn đã đăng xuất thành công.
    </div>

    <form th:action="@{/login}" method="post">
        <label>Username hoặc Email</label>
        <input type="text" name="username" placeholder="Username hoặc email" required autofocus>

        <label>Mật khẩu</label>
        <input type="password" name="password" placeholder="Password" required>

        <button class="btn primary full" type="submit">Đăng nhập</button>
    </form>

    <p style="margin-top: 16px; text-align: center; color: #64748b; font-size: 14px;">
        Tài khoản demo:<br>
        <strong>user01 / 123456</strong> (USER)<br>
        <strong>admin / 123456</strong> (ADMIN)
    </p>
</div>

</body>
</html>
